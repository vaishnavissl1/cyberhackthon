<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title | Replay Console</title>
  <style>$theme</style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="top-frame">
    <nav class="topbar solid" aria-label="Main navigation">
      <a class="brand" href="$home"><span class="mark" aria-hidden="true"><i></i></span>Replay Console</a>
      <div class="top-links">$top_links</div>
    </nav>
  </div>
  <header class="hero hero--compact hero--case" id="top"><div class="shell hero-inner">
    <span class="eyebrow">Replay case</span>
    <h1>$heading</h1>
    <p class="status-line">$source <span class="badge badge--$status_class">$status</span><span>$mode mode</span></p>
    <div class="hero-actions">
      <a class="button button--light" href="$report_link">Download report ↓</a>
      <a class="button button--ghost" href="$blocks_link">Block list ↓</a>
    </div>
  </div></header>
  <main id="main" class="shell case-main">
    <nav class="case-tabs" aria-label="Case sections">
      $case_navigation
    </nav>
    $body
  </main>
  <footer class="footer"><div class="shell"><strong>Replay Console</strong><a href="#top">Back to top ↑</a></div></footer>
</body>
</html>
